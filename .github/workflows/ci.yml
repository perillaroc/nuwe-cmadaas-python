name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:

jobs:
  build:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools_scm derives the version from git tags
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build

      - name: Install wheel and smoke test import
        run: |
          pip install dist/*.whl
          python -c "import nuwe_cmadaas; print(nuwe_cmadaas.__version__)"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: pip install -e ".[test]"

      - name: Run offline tests
        run: pytest tests -m "not integration" --disable-socket --strict-markers

  docs-and-examples:
    name: Offline documentation and examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project, test and documentation dependencies
        run: python -m pip install -e ".[test]" -r docs/requirements.txt

      - name: Check page inventory, API coverage and case references
        run: |
          python docs/check_simulated_pages.py
          python -m pytest tests/unit/test_docs.py tests/unit/test_support_matrix.py tests/unit/test_examples.py -q --disable-socket --strict-markers

      - name: Run examples and execute documentation with loopback-only sockets
        env:
          NUWE_CMADAAS_OFFLINE_DOCS: "1"
        run: |
          export PYTHONPATH="$PWD/docs/_network_guard${PYTHONPATH:+:$PYTHONPATH}"
          python docs/check_offline_kernel.py
          python -m examples --all
          python -m sphinx -b html -E -a -W --keep-going docs/source docs/build/html
          python docs/check_rendered_pages.py docs/build/html
