# Copy to a private file and set NUWE_CMADAAS_TEST_PROFILE to its path.
# Credentials and service address belong in CEDARKIT_CONFIG, not this file.
# Replace every EXAMPLE value with data available to your account before enabling.
datasets:
  obs_station_hourly:
    enabled: false
    data_code: EXAMPLE_STATION_CODE
    elements: Station_Id_C,Lat,Lon,TEM
    station_id: "54533"
    station_ids: ["53592", "54511"]
    station_range: ["53592", "54511"]
    rect_station_id: EXAMPLE_RECT_ID
    admin_station_id: EXAMPLE_ADMIN_ID
    basin_station_id: EXAMPLE_BASIN_ID
    region:
      type: rect
      start_longitude: 115.7
      end_longitude: 117.4
      start_latitude: 41.6
      end_latitude: 39.4
    station_level: "011"
    admin_region: {type: region, admin_codes: "110000"}
    basin_region: {type: basin, basin_codes: CJLY}
    expected_columns: [Station_Id_C, Lat, Lon, TEM]
    max_rows: 20
  obs_station_climate_hourly:
    enabled: false
    # Climate normals for the 1991-2020 reference period, queried without time.
    data_code: SURF_CLI_CHN_HOR_TEM_1991_2020
    elements: Station_Id_C,Lat,Lon,TEM
    expected_columns: [Station_Id_C, Lat, Lon, TEM]
    station_id: "54511"
    order: Station_Id_C:asc
    max_rows: 20
  obs_station_latest:
    enabled: false
    data_code: EXAMPLE_LATEST_STATION_CODE
    expected_columns: [Datetime]
  obs_station_level_range:
    enabled: false
    data_code: EXAMPLE_LEVEL_RANGE_CODE
    elements: Station_Id_C,Lat,Lon,TEM
    station_level: "011"
    expected_columns: [Station_Id_C, Lat, Lon, TEM]
    max_rows: 20
  obs_grid:
    enabled: false
    # The two cataloged grid cases use this hourly precipitation product.
    # OG-005 is a small rectangle; OG-002 requests the full national grid.
    data_code: SURF_CMPAS_CHN_1KM_RT
    parameter: PRE
    region:
      type: rect
      start_longitude: 115.7
      end_longitude: 115.9
      start_latitude: 39.6
      end_latitude: 39.4
  obs_file:
    enabled: false
    # OF-002/OF-003 were verified with this bounded 5 km product.
    data_code: SURF_CMPA_FRT_5KM_10MIN
    max_files: 1
  obs_file_station:
    enabled: false
    # Catalog-supported for OF-009, but absent from the reference account rights.
    data_code: SURF_PRODUCT_PART2_FILE_TAB
    station_id: "54511"
    max_files: 2
  obs_upper_regular:
    enabled: false
    data_code: UPAR_CHN_MUL_FTM
    elements: Station_Id_d,Lat,Lon,PRS_HWC,GPH,EVSS,TEM
    station_id: "54511"
    region: {type: rect, start_longitude: 115.7, end_longitude: 117.4, start_latitude: 41.6, end_latitude: 39.4}
    pressure_level: 850
    height_level: 1500
    vertical_level: 4096
    expected_columns: [Station_Id_d, Lat, Lon, PRS_HWC, GPH, EVSS, TEM]
    max_rows: 20
  obs_upper_gps:
    enabled: false
    # Directory lists these interfaces; the reference account has no confirmed access.
    data_code: UPAR_CHN_GPSMET_MUL
    elements: Station_Id_C,Lat,Lon,TEM
    station_id: "54511"
    region: {type: rect, start_longitude: 115.7, end_longitude: 117.4, start_latitude: 41.6, end_latitude: 39.4}
    expected_columns: [Station_Id_C, Lat, Lon, TEM]
    max_rows: 20
  obs_upper_light:
    enabled: false
    # Replace with a light-data code granted to this account before enabling.
    data_code: UPAR_ADTD_CHN_LIS
    elements: Datetime,Lat,Lon
    region: {type: rect, start_longitude: 115.7, end_longitude: 117.4, start_latitude: 41.6, end_latitude: 39.4}
    expected_columns: [Datetime, Lat, Lon]
    max_rows: 20
  obs_upper_ard:
    enabled: false
    data_code: UPAR_ARD_G_MUT_AMD
    elements: Lat,Lon,Flight_Heigh,TEM
    region: {type: rect, start_longitude: 115.7, end_longitude: 117.4, start_latitude: 41.6, end_latitude: 39.4}
    flight_height_bounds: [0, 15000]
    expected_columns: [Lat, Lon, Flight_Heigh, TEM]
    max_rows: 20
  obs_upper_latest:
    enabled: false
    data_code: UPAR_CHN_MUL_FTM
    expected_columns: [Datetime]
  obs_upper_file:
    enabled: false
    # Access to this catalog-supported wind-profiler file code is now granted.
    data_code: UPAR_WPR_STATUS
    max_files: 1
  obs_upper_file_station:
    enabled: false
    # Access and station 54511 were verified for both station file cases.
    data_code: UPAR_WPR_STATUS
    station_id: "54511"
    max_files: 1
  model_forecast:
    enabled: false
    data_code: NAFP_GRAPES_MESO_FOR_3KM
    parameter: TEM
    level_type: "100"
    level: 850
    forecast_time: 24h
    region: {type: rect, start_longitude: 115.0, end_longitude: 117.0, start_latitude: 41.0, end_latitude: 39.0}
    expected_units: K
  model_forecast_time_only:
    enabled: false
    # Deferred: requires another supported NAFP numerical prediction dataset.
    data_code: NAFP_FOR_SC_GRAPESBCGZ_9KM_CHN
    parameter: TPE03
  model_forecast_rect_time:
    enabled: false
    # Deferred: requires another supported NAFP numerical prediction dataset.
    data_code: NAFP_FOR_SC_GRAPESBCGZ_9KM_CHN
    parameter: TPE03
    region: {type: rect, start_longitude: 112.0, end_longitude: 113.0, start_latitude: 24.0, end_latitude: 23.0}
  model_reps_control:
    enabled: false
    data_code: NAFP_GRAPESREPS_FOR_FTM_CHN
    parameter: TEM
    level_type: "100"
    level: 850
    forecast_time: 24h
    member_number: 0
    region: {type: rect, start_longitude: 115.0, end_longitude: 117.0, start_latitude: 41.0, end_latitude: 39.0}
    expected_units: K
  model_reps_member:
    enabled: false
    data_code: NAFP_GRAPESREPS_FOR_FTM_DIS_CHN
    parameter: TEM
    level_type: "100"
    level: 850
    forecast_time: 24h
    member_number: 10
    region: {type: rect, start_longitude: 115.0, end_longitude: 117.0, start_latitude: 41.0, end_latitude: 39.0}
    expected_units: K
  model_analysis:
    enabled: false
    data_code: NAFP_GRAPES_MESO_ANA_3KM
    parameter: TEM
    level_type: "100"
    level: 850
    region: {type: rect, start_longitude: 115.0, end_longitude: 117.0, start_latitude: 41.0, end_latitude: 39.0}
    expected_units: K
  model_point:
    enabled: false
    data_code: EXAMPLE_MODEL_POINT_CODE
    parameter: TEM
    level_type: "100"
    level: 850
    forecast_time: 24h
    station_id: EXAMPLE_ID
    longitude: 110.0
    latitude: 30.0
    expected_columns: [TEM]
    max_rows: 20
  model_file:
    enabled: false
    data_code: EXAMPLE_MODEL_FILE_CODE
    parameter: TEM
    level_type: "100"
    level: 850
    forecast_time: 24h
low_level:
  callAPI_to_array2D:
    enabled: false
    interface_id: EXAMPLE_TABLE_INTERFACE
    data_code: EXAMPLE_TABLE_CODE
    params: {elements: Station_Id_C,TEM}
    formats: []
  callAPI_to_gridArray2D: {enabled: false}
  callAPI_to_gridScalar2D: {enabled: false}
  callAPI_to_gridVector2D: {enabled: false}
  callAPI_to_fileList: {enabled: false}
  callAPI_to_downFile: {enabled: false}
  callAPI_to_saveAsFile: {enabled: false}
  callAPI_to_dataBlock: {enabled: false}
  callAPI_to_serializedStr: {enabled: false, formats: []}
cases:
  OS-007: {enabled: false}
  OG-002: {enabled: false}  # full national grid; enable separately
  OG-005: {enabled: false}  # small rectangle smoke case
  OU-010: {enabled: false}  # regular upper-air smoke case
  OF-002: {enabled: false}
  OF-003: {enabled: false}
  OF-009: {enabled: false}  # requires a station file data code granted to this account
  OUF-002: {enabled: false}
  OUF-003: {enabled: false}
  OUF-007: {enabled: false}
  OUF-009: {enabled: false}
  MGF-002: {enabled: false}  # deferred; needs another supported NAFP dataset
  MGF-008: {enabled: false}  # full-domain forecast
  MGF-010: {enabled: false}  # deferred; needs another supported NAFP dataset
  MGF-016: {enabled: false}
  MGF-017: {enabled: false}  # full-domain REPS control
  MGF-017-member-10: {enabled: false}  # full-domain REPS member
  MGF-018: {enabled: false}
  MGA-005: {enabled: false}  # full-domain analysis
  MGA-013: {enabled: false}
download_limits:
  max_files: 2
  max_total_bytes: 10485760
  preflight_file_list: true
  unbounded_download_approved: false
  approved_data_scope: null
  approval_reason: null
