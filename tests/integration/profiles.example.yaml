# Copy to a private file and set NUWE_CMADAAS_TEST_PROFILE to its path.
# Credentials and service address belong in CEDARKIT_CONFIG, not this file.
# Replace every EXAMPLE value with data available to your account before enabling.
datasets:
  obs_station_hourly:
    enabled: false
    data_code: EXAMPLE_STATION_CODE
    elements: Station_Id_C,Lat,Lon,TEM
    station_id: "54533"
    station_ids: ["53592", "54511"]
    station_range: ["53592", "54511"]
    rect_station_id: EXAMPLE_RECT_ID
    admin_station_id: EXAMPLE_ADMIN_ID
    basin_station_id: EXAMPLE_BASIN_ID
    region:
      type: rect
      start_longitude: 115.7
      end_longitude: 117.4
      start_latitude: 41.6
      end_latitude: 39.4
    station_level: "011"
    admin_region: {type: region, admin_codes: "110000"}
    basin_region: {type: basin, basin_codes: CJLY}
    expected_columns: [Station_Id_C, Lat, Lon, TEM]
    max_rows: 20
  obs_station_climate_hourly:
    enabled: false
    # Climate normals for the 1991-2020 reference period, queried without time.
    data_code: SURF_CLI_CHN_HOR_TEM_1991_2020
    elements: Station_Id_C,Lat,Lon,TEM
    expected_columns: [Station_Id_C, Lat, Lon, TEM]
    station_id: "54511"
    order: Station_Id_C:asc
    max_rows: 20
  obs_station_latest:
    enabled: false
    data_code: EXAMPLE_LATEST_STATION_CODE
    expected_columns: [Datetime]
    latest_hours: 24
  obs_station_level_range:
    enabled: false
    data_code: EXAMPLE_LEVEL_RANGE_CODE
    elements: Station_Id_C,Lat,Lon,TEM
    station_level: "011"
    expected_columns: [Station_Id_C, Lat, Lon, TEM]
    max_rows: 20
  obs_grid:
    enabled: false
    # The two cataloged grid cases use this hourly precipitation product.
    # OG-005 is a small rectangle; OG-002 requests the full national grid.
    data_code: SURF_CMPAS_CHN_1KM_RT
    parameter: PRE
    region:
      type: rect
      start_longitude: 115.7
      end_longitude: 115.9
      start_latitude: 39.6
      end_latitude: 39.4
  obs_file:
    enabled: false
    # OF-002/OF-003 were verified with this bounded 5 km product.
    data_code: SURF_CMPA_FRT_5KM_10MIN
    max_files: 1
  obs_file_station:
    enabled: false
    # Catalog-supported for OF-009, but absent from the reference account rights.
    data_code: SURF_PRODUCT_PART2_FILE_TAB
    station_id: "54511"
    max_files: 2
  obs_upper_regular:
    enabled: false
    data_code: UPAR_CHN_MUL_FTM
    elements: Station_Id_d,Lat,Lon,PRS_HWC,GPH,EVSS,TEM
    station_id: "54511"
    region: {type: rect, start_longitude: 115.7, end_longitude: 117.4, start_latitude: 41.6, end_latitude: 39.4}
    pressure_level: 850
    height_level: 1500
    vertical_level: 4096
    expected_columns: [Station_Id_d, Lat, Lon, PRS_HWC, GPH, EVSS, TEM]
    max_rows: 20
  obs_upper_gps:
    enabled: false
    # Directory lists these interfaces; the reference account has no confirmed access.
    data_code: UPAR_CHN_GPSMET_MUL
    elements: Station_Id_C,Lat,Lon,TEM
    station_id: "54511"
    region: {type: rect, start_longitude: 115.7, end_longitude: 117.4, start_latitude: 41.6, end_latitude: 39.4}
    expected_columns: [Station_Id_C, Lat, Lon, TEM]
    max_rows: 20
  obs_upper_light:
    enabled: false
    # Replace with a light-data code granted to this account before enabling.
    data_code: UPAR_ADTD_CHN_LIS
    elements: Datetime,Lat,Lon
    region: {type: rect, start_longitude: 115.7, end_longitude: 117.4, start_latitude: 41.6, end_latitude: 39.4}
    expected_columns: [Datetime, Lat, Lon]
    max_rows: 20
  obs_upper_ard:
    enabled: false
    data_code: UPAR_ARD_G_MUT_AMD
    elements: Lat,Lon,Flight_Heigh,TEM
    region: {type: rect, start_longitude: 115.7, end_longitude: 117.4, start_latitude: 41.6, end_latitude: 39.4}
    flight_height_bounds: [0, 15000]
    expected_columns: [Lat, Lon, Flight_Heigh, TEM]
    max_rows: 20
  obs_upper_latest:
    enabled: false
    data_code: UPAR_CHN_MUL_FTM
    expected_columns: [Datetime]
  obs_upper_file:
    enabled: false
    # Access to this catalog-supported wind-profiler file code is now granted.
    data_code: UPAR_WPR_STATUS
    max_files: 1
  obs_upper_file_station:
    enabled: false
    # Access and station 54511 were verified for both station file cases.
    data_code: UPAR_WPR_STATUS
    station_id: "54511"
    max_files: 1
  model_forecast:
    enabled: false
    data_code: NAFP_GRAPES_MESO_FOR_3KM
    parameter: TEM
    level_type: "100"
    level: 850
    forecast_time: 24h
    region: {type: rect, start_longitude: 115.0, end_longitude: 117.0, start_latitude: 41.0, end_latitude: 39.0}
    expected_units: K
  model_forecast_time_only:
    enabled: false
    # Deferred: requires another supported NAFP numerical prediction dataset.
    data_code: NAFP_FOR_SC_GRAPESBCGZ_9KM_CHN
    parameter: TPE03
  model_forecast_rect_time:
    enabled: false
    # Deferred: requires another supported NAFP numerical prediction dataset.
    data_code: NAFP_FOR_SC_GRAPESBCGZ_9KM_CHN
    parameter: TPE03
    region: {type: rect, start_longitude: 112.0, end_longitude: 113.0, start_latitude: 24.0, end_latitude: 23.0}
  model_reps_control:
    enabled: false
    data_code: NAFP_GRAPESREPS_FOR_FTM_CHN
    parameter: TEM
    level_type: "100"
    level: 850
    forecast_time: 24h
    member_number: 0
    region: {type: rect, start_longitude: 115.0, end_longitude: 117.0, start_latitude: 41.0, end_latitude: 39.0}
    expected_units: K
  model_reps_member:
    enabled: false
    data_code: NAFP_GRAPESREPS_FOR_FTM_DIS_CHN
    parameter: TEM
    level_type: "100"
    level: 850
    forecast_time: 24h
    member_number: 10
    region: {type: rect, start_longitude: 115.0, end_longitude: 117.0, start_latitude: 41.0, end_latitude: 39.0}
    expected_units: K
  model_analysis:
    enabled: false
    data_code: NAFP_GRAPES_MESO_ANA_3KM
    parameter: TEM
    level_type: "100"
    level: 850
    region: {type: rect, start_longitude: 115.0, end_longitude: 117.0, start_latitude: 41.0, end_latitude: 39.0}
    expected_units: K
  model_point:
    enabled: false
    # Prefer CMA-GFS; this forecast product is listed for all four B10 APIs.
    data_code: NAFP_FOR_FTM_GRAPES_CFSV2_NEHE
    parameter: TEM
    level_type: "103"
    level: 2
    forecast_time: 24h
    forecast_time_range: [6h, 24h]
    station_id: "54511"
    point: [39.9, 116.4]
    second_point: [31.2, 121.5]
    expected_columns: [lat, lon, datetime, level, validtime, TEM_103]
    expected_station_columns: [lat, lon, station_id_c, datetime, level, validtime, TEM_103]
    expected_value_bounds: [150, 350]
    max_rows: 20
  model_file_gfs:
    enabled: false
    # MF-003/004 use limitCnt=1 (about 50 MB); MF-008 is about 28.5 MB.
    data_code: NAFP_FOR_FTM_GRAPES_CFSV2_NEHE
    parameter: TEM
    level_type: "103"
    level: 2
    forecast_time: 24h
    max_files: 1
  model_file_reps_control:
    enabled: false
    # MF-009 passed with a one-file, 1.5 GiB extended profile; disabled by default.
    data_code: NAFP_GRAPESREPS_FOR_FTM_CHN
    parameter: TEM
    level_type: "103"
    level: 2
    forecast_time: 24h
    max_files: 1
  model_file_reps_member:
    enabled: false
    # MF-010/012/019 passed with a one-file, 1.5 GiB extended profile.
    data_code: NAFP_GRAPESREPS_FOR_FTM_DIS_CHN
    parameter: TEM
    level_type: "103"
    level: 2
    forecast_time: 24h
    max_files: 1
  model_latest:
    enabled: false
    # getNafpLatestTime returns a Datetime table for this cataloged CMA-GFS analysis product.
    data_code: NAFP_ANA_FTM_GRAPES_GFS_NEHE
    latest_hours: "72"
low_level:
  callAPI_to_array2D:
    enabled: false
    data_code: NAFP_FOR_FTM_GRAPES_CFSV2_NEHE
    element: TEM
    level_type: "103"
    level: "2"
    valid_time: "24"
    lat_lons: "39.9/116.4"
    expected_value_bounds: [150, 350]
  callAPI_to_gridArray2D: &gfs_grid
    enabled: false
    data_code: NAFP_FOR_FTM_GRAPES_CFSV2_NEHE
    element: TEM
    level_type: "103"
    level: "2"
    valid_time: "24"
    min_lon: "115"
    max_lon: "116"
    min_lat: "39"
    max_lat: "40"
    expected_value_bounds: [150, 350]
  callAPI_to_gridScalar2D: *gfs_grid
  callAPI_to_gridVector2D:
    enabled: false
    data_code: NAFP_ANA_FTM_GRAPES_GFS_NEHE
    u_element: WIU
    v_element: WIV
    level_type: "100"
    level: "850"
    valid_time: "0"
  callAPI_to_fileList: &gfs_file
    enabled: false
    data_code: NAFP_FOR_FTM_GRAPES_CFSV2_NEHE
    element: TEM
    level_type: "103"
    max_files: 1
  callAPI_to_downFile: *gfs_file
  callAPI_to_saveAsFile:
    enabled: false
    data_code: NAFP_FOR_FTM_GRAPES_CFSV2_NEHE
    element: TEM
    level_type: "103"
    level: "2"
    valid_time: "24"
    lat_lons: "39.9/116.4"
    formats: [json, xml, text, html]
    max_output_bytes: 1048576
  callAPI_to_dataBlock:
    enabled: false
    # No RetDataBlock interface/dataCode pairing is verified in the 2026-10-07 catalog.
    data_code: EXAMPLE_AUTHORIZED_BLOCK_CODE
    max_bytes: 1048576
  callAPI_to_serializedStr:
    enabled: false
    data_code: NAFP_FOR_FTM_GRAPES_CFSV2_NEHE
    element: TEM
    level_type: "103"
    level: "2"
    valid_time: "24"
    lat_lons: "39.9/116.4"
    formats: [json, xml, text, html]
